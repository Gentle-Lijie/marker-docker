services:
  marker:
    # Use pre-built image from GitHub Container Registry
    image: ghcr.io/gentle-lijie/marker-docker:latest
    
    # For local development, uncomment the build section and comment out the image above:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    # image: marker-pdf:latest
    
    container_name: marker-server
    ports:
      - "8000:8000"
    volumes:
      # Mount volumes for uploads and outputs
      - ./uploads:/app/uploads
      - ./outputs:/app/outputs
    environment:
      # Default to CPU, can be overridden
      - TORCH_DEVICE=cpu
      # Optional: Add your API keys here or use .env file
      # - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      # - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    restart: unless-stopped
    # Uncomment for GPU support (requires nvidia-docker)
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
